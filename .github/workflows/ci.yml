name: CI

on:
  push:
    branches: [main, "phase-*"]
  pull_request:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: No hardcoded colors
        run: node scripts/check-hardcoded-colors.mjs
